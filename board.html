<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Completion Dashboard</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
  }

  body {
    background: #ffffff;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: #1f2937;
    padding: 18px 16px;
  }

  .dashboard {
    max-width: 1200px;
    margin: 0 auto;
    border: 1px solid #d1d5db;
  }

  /* ===== 第一层：Project Tab ===== */
  .project-tabs {
    display: flex;
    border-bottom: 2px solid #111827;
    background: #f9fafb;
  }

  .project-tabs .tab {
    padding: 14px 32px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border: none;
    border-right: 1px solid #e5e7eb;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
  }

  .project-tabs .tab:hover {
    background: #eef2ff;
  }

  .project-tabs .tab.active {
    background: #111827;
    color: #ffffff;
  }

  .main-content {
    padding: 20px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7280;
    margin: 13px 0 7px;
  }

  .section-label:first-child {
    margin-top: 0;
  }

  /* ===== 嵌套 Tab：所有层级共用同一套样式，用缩进体现层级（无文字标签） ===== */
  .tab-row {
    display: flex;
    align-items: center;
    position: relative;
    margin-bottom: 12px;
  }

  .tab-row.level-2 {
    padding-left: 26px;
  }

  /* 层级导引线：表示这一排 Tab 属于上一层选中的项 */
  .tab-row.level-2::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e5e7eb;
  }

  .tabs {
    display: inline-flex;
    border: 1px solid #d1d5db;
    background: #ffffff;
  }

  .tabs .tab {
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    border-right: 1px solid #e5e7eb;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
    white-space: nowrap;
  }

  .tabs .tab:last-child { border-right: none; }
  .tabs .tab:hover { background: #eef2ff; }
  .tabs .tab.active { background: #111827; color: #ffffff; }

  /* ===== 图表区 ===== */
  .chart-box {
    border: 1px solid #d1d5db;
    padding: 12px 14px;
    margin-top: 10px;
    margin-bottom: 22px;
  }

  .chart-box h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #374151;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
  }

  .chart-canvas {
    position: relative;
    width: 100%;
    height: 200px;
  }

  .chart-canvas.tall {
    height: 260px;
  }

  /* ===== 顶部：Project 切换 + 全局时间窗口 ===== */
  .topbar {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    flex-wrap: wrap;
    background: #f9fafb;
    border-bottom: 2px solid #111827;
  }

  .topbar .project-tabs { border-bottom: none; flex: 1 1 auto; }

  .window-tabs {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-left: 1px solid #e5e7eb;
    background: #ffffff;
  }

  .window-tabs .wt-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    margin-right: 4px;
  }

  .window-tabs .tab {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #4b5563;
    cursor: pointer;
  }
  .window-tabs .tab:hover  { background: #eef2ff; }
  .window-tabs .tab.active { background: #111827; border-color: #111827; color: #ffffff; }

  /* ===== 图表区：每个图表占满整行，跟随其所属层级 ===== */
  .chart-sub {
    font-size: 11.5px;
    color: #6b7280;
    margin: -4px 0 8px;
  }

  /* 图例 + 计数 */
  .chips {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-height: 26px;
    font-size: 11.5px;
    color: #374151;
    margin-bottom: 8px;
  }
  .chips .chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chips .chip b { font-size: 13px; }
  .chips .dot { width: 10px; height: 10px; display: inline-block; flex: 0 0 auto; }
  .chips .dot.success { background: #15803d; }
  .chips .dot.skipped { background: #b45309; }
  .chips .dot.failed  { background: #b91c1c; }
  .chips .dot.recent  { background: #15803d; }
  .chips .dot.earlier { background: #74c69d; }
  .chips .dot.remain  { background: #e5e7eb; border: 1px solid #d1d5db; }

  .rel-empty {
    font-size: 13px;
    color: #9ca3af;
    padding: 28px 0;
    text-align: center;
  }

  /* ===== 结论区：3 个关键指标 ===== */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    border: 1px solid #d1d5db;
    background: #fafafa;
    padding: 12px;
  }

  .kpi {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-top: 3px solid #6b7280;
    padding: 10px 12px;
  }
  .kpi .kpi-l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
  .kpi .kpi-v { font-size: 27px; font-weight: 700; color: #111827; line-height: 1.1; margin-top: 3px; }
  .kpi .kpi-s { font-size: 11.5px; color: #6b7280; margin-top: 3px; }
  .kpi.good { border-top-color: #15803d; }
  .kpi.warn { border-top-color: #b45309; }
  .kpi.bad  { border-top-color: #b91c1c; }
  .kpi.good .kpi-v { color: #15803d; }
  .kpi.warn .kpi-v { color: #b45309; }
  .kpi.bad  .kpi-v { color: #b91c1c; }
  .kpi .kpi-warn { color: #b45309; font-weight: 600; }

  .kpi-read {
    font-size: 12px;
    line-height: 1.5;
    color: #6b7280;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-top: none;
    padding: 9px 16px;
    margin-bottom: 16px;
  }
  .kpi-read b { color: #374151; }

  /* ===== 明细区（常驻显示，不折叠） ===== */
  .details-box { border: 1px solid #d1d5db; }
  .details-body { padding: 16px; }

  /* ===== RWI 时间窗口（Last 30 / 60 / 90 days，按 updated 字段过滤） ===== */
  .activity-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .activity-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
  }

  .period-summary {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    margin-bottom: 10px;
    padding: 8px 12px;
    border: 1px solid #d1d5db;
    background: #fafafa;
    flex-wrap: wrap;
  }

  .period-summary .ps-num { font-size: 18px; font-weight: 700; color: #111827; }
  .period-summary .ps-key { color: #6b7280; margin-left: 3px; }
  .period-summary .ps-sep { color: #d1d5db; }
  .period-summary .ps-grow { flex: 1 1 auto; }

  .trend { font-weight: 700; font-size: 12px; margin-left: 8px; }
  .trend.up   { color: #15803d; }
  .trend.down { color: #b91c1c; }
  .trend.flat { color: #6b7280; }

  /* ===== RWI 表格 ===== */
  table.rwi {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  table.rwi th,
  table.rwi td {
    border: 1px solid #d1d5db;
    padding: 7px 9px;
    text-align: left;
    vertical-align: middle;
  }

  table.rwi thead th {
    background: #f3f4f6;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #374151;
    white-space: nowrap;
  }

  table.rwi tbody tr:nth-child(even) {
    background: #fafafa;
  }

  .st {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .st-done  { color: #15803d; }
  .st-wip   { color: #b45309; }
  .st-open  { color: #b91c1c; }

  .placeholder {
    font-size: 13px;
    color: #9ca3af;
    padding: 24px 0;
  }

  /* ===== 表头过滤器 + 分页 ===== */
  .rwi-tools {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .rwi-count { font-size: 12px; color: #6b7280; }

  .btn-clear {
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid #b91c1c;
    background: #ffffff;
    color: #b91c1c;
    cursor: pointer;
  }
  .btn-clear:hover { background: #fef2f2; }

  table.rwi .rwi-filters th {
    background: #ffffff;
    padding: 5px 4px;
    vertical-align: middle;
  }
  .rwi-filters input[type="text"],
  .rwi-filters select {
    width: 100%;
    min-width: 74px;
    font-size: 11px;
    padding: 3px 5px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #1f2937;
    box-sizing: border-box;
  }
  .rwi-filters input:focus,
  .rwi-filters select:focus {
    outline: 1px solid #111827;
  }

  .rwi-pager {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }
  .rwi-pager .pg {
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #111827;
    cursor: pointer;
  }
  .rwi-pager .pg:hover:not(:disabled) { background: #f3f4f6; }
  .rwi-pager .pg:disabled { opacity: 0.4; cursor: default; }
  .rwi-pager .pg-info { font-size: 12px; color: #374151; }

  @media (max-width: 768px) {
    .kpi-strip { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="topbar">
    <div class="project-tabs" id="projectTabs"></div>
    <div class="window-tabs" id="windowTabs"></div>
  </div>
  <div class="main-content" id="mainContent"></div>
</div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  // ============ 数据 ============
  // 数据已与模板拆分，存放于 data.js（全局 window.DASHBOARD_DATA）。
  // 之后更新组件数量（done/total）与 RWI 时，只需编辑 data.js。
  const DATA = window.DASHBOARD_DATA || {};

  // App keys 按 project 显式映射；未列出的 project 回退到 data.js 中该项目的 apps 键。
  const PROJECT_APP_KEYS = {
    "F24": ["Infra", "Helm", "CM"],
    "C48": ["Infra", "Helm", "DAG", "DB"],
    "DDS": ["Infra"]
  };
  // Market keys 按 project 显式映射；未列出的 project 回退到 data.js 中该项目的 markets 键。
  const PROJECT_MARKETS = {
    "F24": ["EU", "AMH", "HASE", "APST", "MX", "US", "INDIA"],
    "C48": ["UK", "HASE", "MYH"],
    "DDS": ["IN", "GB", "HK"]
  };
  function marketKeysOf(project) {
    const keys = PROJECT_MARKETS[project];
    if (keys && keys.length) return keys;
    const d = DATA[project];
    return d && d.markets ? Object.keys(d.markets) : [];
  }
  function marketRef(project, market) {
    return (DATA[project] && DATA[project].markets && DATA[project].markets[market]) || null;
  }
  function appKeysOf(project) {
    const keys = PROJECT_APP_KEYS[project];
    if (keys && keys.length) return keys;
    const ms = marketKeysOf(project);
    const mk = ms.length ? marketRef(project, ms[0]) : null;
    return mk && mk.apps ? Object.keys(mk.apps) : [];
  }
  // 环境：Production 在最前，一行显示
  const ENV_ORDER = [
    { key: "prod",    label: "Production" },
    { key: "pre",     label: "Pre-Production" },
    { key: "nonprod", label: "Non-Production" }
  ];

  let currentProject = "F24";
  let currentMarket  = marketKeysOf("F24")[0];   // 默认 F24 的第一个 Market
  let currentApp     = appKeysOf(currentProject)[0];
  let currentEnv     = "prod";   // 默认 Production

  // 时间窗口：data.js 始终准备最近 90 天的数据，前端按用户点击过滤 30/60/90
  const TIME_WINDOWS = [
    { days: 30, label: "Last 30 days" },
    { days: 60, label: "Last 60 days" },
    { days: 90, label: "Last 90 days" }
  ];
  let currentWindow = 30;

  // ===== 统一配色：两张图（以及图例圆点）共用同一套风格 =====
  // 想整体换成黑白灰风格时，只改这里的色值即可（保持两图一致）。
  const PALETTE = {
    complete:    "#15803d",   // 完成（本窗口）
    completeOld: "#74c69d",   // 完成（更早）
    remaining:   "#e5e7eb",   // 尚未完成
    success:     "#15803d",   // 发布成功
    skipped:     "#b45309",   // 发布跳过
    failed:      "#b91c1c"    // 发布失败
  };
  // 未选中的应用的减淡色（仅用于应用对比图的强调效果）
  const DIM = {
    complete:    "rgba(21, 128, 61, 0.28)",
    completeOld: "rgba(116, 198, 157, 0.32)"
  };

  let appBarChart  = null;
  let componentReleaseChart = null;

  document.addEventListener("DOMContentLoaded", init);

  function init() {
    renderProjectTabs();
    renderWindowTabs();
    renderContent();
  }

  // ===== 第一层：Project Tab =====
  function renderProjectTabs() {
    const c = document.getElementById("projectTabs");
    c.innerHTML = "";
    Object.keys(DATA).forEach(proj => {
      const b = document.createElement("button");
      b.className = "tab" + (proj === currentProject ? " active" : "");
      b.textContent = proj;
      b.onclick = () => {
        currentProject = proj;
        currentMarket  = marketKeysOf(proj)[0];
        currentApp     = appKeysOf(proj)[0];
        currentEnv     = "prod";
        renderProjectTabs();
        renderContent();
      };
      c.appendChild(b);
    });
  }

  // ===== 全局时间窗口（Last 30 / 60 / 90 days，驱动所有按时间过滤的图/表） =====
  function renderWindowTabs() {
    const c = document.getElementById("windowTabs");
    if (!c) return;
    c.innerHTML = `<span class="wt-label">Period</span>` + TIME_WINDOWS.map(w =>
      `<button type="button" class="tab${w.days === currentWindow ? " active" : ""}" onclick="setWindow(${w.days})">${w.label}</button>`
    ).join("");
  }

  // ===== 主内容 =====
  function renderContent() {
    const main = document.getElementById("mainContent");

    main.innerHTML = `
      <div class="tab-row level-1">
        <div class="tabs" id="marketTabs"></div>
      </div>
      <div class="tab-row level-2">
        <div class="tabs" id="envTabs"></div>
      </div>

      <div class="chart-box">
        <h3>Completion by application</h3>
        <div class="chart-sub" id="appChartSub"></div>
        <div class="chips" id="appChartStats"></div>
        <div class="chart-canvas tall"><canvas id="appBarChart"></canvas></div>
      </div>

      <div class="tab-row level-1">
        <div class="tabs" id="appTabs"></div>
      </div>

      <div class="section-label" id="headlineLabel"></div>
      <div class="kpi-strip" id="kpiStrip"></div>
      <div class="kpi-read" id="kpiRead"></div>

      <div class="chart-box">
        <h3>Release outcomes by component</h3>
        <div class="chart-sub" id="componentReleaseSub"></div>
        <div class="chips" id="componentReleaseStats"></div>
        <div class="chart-canvas tall" id="componentReleaseCanvasWrap">
          <canvas id="componentReleaseChart"></canvas>
        </div>
        <div class="rel-empty" id="componentReleaseEmpty" style="display:none;">
          No components tracked for this application / environment.
        </div>
      </div>

      <div class="section-label">Details — release work items</div>
      <div class="details-box">
        <div class="details-body" id="envDetail"></div>
      </div>
    `;

    renderMarketTabs();
    renderEnvTabs();
    renderAppTabs();
    renderKpiStrip();
    renderEnvDetail();
    createAppBarChart();
    createComponentReleaseChart();
  }

  // 所有随时间窗口 / 选择变化的区域统一刷新
  function refreshAll() {
    renderMarketTabs();
    renderEnvTabs();
    renderAppTabs();
    renderKpiStrip();
    renderEnvDetail();
    createAppBarChart();
    createComponentReleaseChart();
  }

  // ===== 第二层：Market Tab =====
  function renderMarketTabs() {
    const c = document.getElementById("marketTabs");
    if (!c) return;
    c.innerHTML = "";
    marketKeysOf(currentProject).forEach(mkt => {
      const b = document.createElement("button");
      b.className = "tab" + (mkt === currentMarket ? " active" : "");
      b.textContent = mkt;
      b.onclick = () => {
        currentMarket = mkt;
        currentApp    = appKeysOf(currentProject)[0];
        currentEnv    = "prod";
        refreshAll();
      };
      c.appendChild(b);
    });
  }

  // ===== 环境选择（与 Market / Application 同一种分段控件） =====
  function renderEnvTabs() {
    const c = document.getElementById("envTabs");
    if (!c) return;
    c.innerHTML = "";
    ENV_ORDER.forEach(env => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (env.key === currentEnv ? " active" : "");
      b.textContent = env.label;
      b.onclick = () => { currentEnv = env.key; refreshAll(); };
      c.appendChild(b);
    });
  }

  // ===== 结论区：3 个关键指标（全部为当前 App × 当前 Environment） =====
  function renderKpiStrip() {
    const strip = document.getElementById("kpiStrip");
    const read  = document.getElementById("kpiRead");
    if (!strip) return;

    const label = document.getElementById("headlineLabel");
    if (label) label.textContent =
      `Headline — ${currentApp} · ${labelOf(currentEnv)} · last ${currentWindow} days`;

    const stat   = getStat(currentProject, currentApp, currentEnv);
    const comp   = pctOf(stat);
    const sum    = releaseSummary(currentWindow);
    const relPct = sum.compCount ? Math.round((sum.released / sum.compCount) * 100) : 0;
    const rateTone = sum.all === 0 ? "neutral" : sum.rate >= 90 ? "good" : sum.rate >= 70 ? "warn" : "bad";

    strip.innerHTML = `
      <div class="kpi neutral">
        <div class="kpi-l">Component completion</div>
        <div class="kpi-v">${comp}%</div>
        <div class="kpi-s">${stat.done} of ${stat.total} components complete${stat.done > stat.total ? ` <span class="kpi-warn">⚠ done exceeds total</span>` : ""}</div>
      </div>
      <div class="kpi ${rateTone}">
        <div class="kpi-l">Release success rate</div>
        <div class="kpi-v">${sum.all ? sum.rate + "%" : "—"}</div>
        <div class="kpi-s">${sum.totals.Success} of ${sum.all} release attempts succeeded · last ${currentWindow}d</div>
      </div>
      <div class="kpi neutral">
        <div class="kpi-l">Components released</div>
        <div class="kpi-v">${sum.released}<span style="font-size:16px;color:#9ca3af;">/${sum.compCount}</span></div>
        <div class="kpi-s">${relPct}% shipped at least once · last ${currentWindow}d</div>
      </div>
    `;

    if (read) read.innerHTML = `<b>How to read:</b> <b>Component completion</b> = components delivered to this environment (all time). <b>Release success rate</b> = successful releases ÷ all release attempts in the last ${currentWindow} days. <b>Components released</b> = components with at least one successful release in that period.`;
  }

  // ===== 第三层：App Tab =====
  function renderAppTabs() {
    const c = document.getElementById("appTabs");
    c.innerHTML = "";
    appKeysOf(currentProject).forEach(app => {
      const b = document.createElement("button");
      b.className = "tab" + (app === currentApp ? " active" : "");
      b.textContent = app;
      b.onclick = () => {
        currentApp = app;
        refreshAll();
      };
      c.appendChild(b);
    });
  }

  // ===== 表格筛选 / 分页由 activityColumnHTML + bindActivityTable 处理 =====

  // ===== 环境详情 / 明细：RWI 活动（按全局时间窗口过滤） =====
  function renderEnvDetail() {
    const c = document.getElementById("envDetail");
    if (!c) return;
    c.innerHTML = activityColumnHTML(currentWindow);
    // 表格筛选 / 分页绑定（仅首次渲染该 app+env 时重置分页）
    bindActivityTable();
  }

  // ===== RWI 时间窗口筛选（最近 30/60/90 天，按 updated 字段） =====
  function rwiDateOf(row) {
    if (!row || !row.updated) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(row.updated).trim());
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }

  function dayAgo(days) {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate() - days);
  }

  function isInWindow(row, days) {
    const d = rwiDateOf(row);
    return d && d >= dayAgo(days) && d <= dayAgo(0);
  }

  // 上一个同长度周期：[today-2d, today-d) —— 用于比较改善 / 恶化
  function isPrevBand(row, days) {
    const d = rwiDateOf(row);
    return d && d >= dayAgo(days * 2) && d < dayAgo(days);
  }

  function statusKey(r) { return String(r.status || "").trim().toUpperCase(); }

  function countByStatus(rows) {
    const c = { DONE: 0, WIP: 0, OPEN: 0 };
    rows.forEach(r => { const k = statusKey(r); if (k in c) c[k]++; });
    return c;
  }

  // 表格分页
  const PAGE_SIZE = 10;
  let tablePage = 1;
  let tableKey = "";

  function activityColumnHTML(days) {
    const all  = envRowsAll();
    const rows = all.filter(r => isInWindow(r, days));
    const cur  = countByStatus(rows);
    const total = cur.DONE + cur.WIP + cur.OPEN;
    const pct  = total ? Math.round((cur.DONE / total) * 100) : 0;

    // 与上一个同长度周期比较 → 改善 / 恶化 / 稳定
    const prev      = countByStatus(all.filter(r => isPrevBand(r, days)));
    const prevTotal = prev.DONE + prev.WIP + prev.OPEN;
    const prevPct   = prevTotal ? Math.round((prev.DONE / prevTotal) * 100) : null;
    const trend = prevPct === null
      ? { cls: "flat", txt: "— no earlier data" }
      : pct > prevPct + 0.5
        ? { cls: "up",    txt: `▲ improving vs prior ${days}d (${pct}% vs ${prevPct}%)` }
        : pct < prevPct - 0.5
          ? { cls: "down",  txt: `▼ deteriorating vs prior ${days}d (${pct}% vs ${prevPct}%)` }
          : { cls: "flat",  txt: `→ stable vs prior ${days}d (${pct}% vs ${prevPct}%)` };

    return `
      <div>
        <div class="activity-head">
          <span class="activity-title">Release work items · updated in the last ${days} days</span>
          <span class="trend ${trend.cls}">${trend.txt}</span>
        </div>
        <div class="period-summary">
          <span><span class="ps-num">${cur.DONE}</span><span class="ps-key">done</span></span>
          <span class="ps-sep">|</span>
          <span><span class="ps-num">${cur.WIP}</span><span class="ps-key">wip</span></span>
          <span class="ps-sep">|</span>
          <span><span class="ps-num">${cur.OPEN}</span><span class="ps-key">open</span></span>
          <span class="ps-sep">|</span>
          <span><span class="ps-num">${pct}%</span><span class="ps-key">done in window</span></span>
          <span class="ps-grow"></span>
        </div>
        ${rwiTableSkeleton()}
      </div>
    `;
  }

  function setWindow(days) {
    currentWindow = days;
    tablePage = 1;
    renderWindowTabs();
    refreshAll();
  }

  function envRowsAll() {
    const m = marketRef(currentProject, currentMarket);
    return (m && m.rwi[currentApp] && m.rwi[currentApp][currentEnv]) || [];
  }

  function activityRowsInWindow() {
    return envRowsAll().filter(r => isInWindow(r, currentWindow));
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function uniqSorted(arr) {
    return [...new Set(arr.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b)));
  }

  // ===== 表格骨架：表头 + 每列表头过滤器，tbody / 分页由 renderTableResults() 填充 =====
  function rwiTableSkeleton() {
    const compOptions = uniqSorted(envRowsAll().map(r => r.component))
      .map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

    return `
      <div class="rwi-tools">
        <span class="rwi-count" id="rwiCount"></span>
        <span class="ps-grow"></span>
        <button type="button" class="btn-clear" id="btnClearFilters">✕ Clear filters</button>
      </div>
      <div style="overflow-x:auto;">
      <table class="rwi">
        <thead>
          <tr>
            <th>RWI ID</th>
            <th>Component</th>
            <th>Title</th>
            <th>CR</th>
            <th>Updated</th>
            <th>Status</th>
          </tr>
          <tr class="rwi-filters">
            <th><input type="text" id="fId" placeholder="Contains…" title="Filter RWI ID"></th>
            <th><select id="fComponent" title="Filter component"><option value="">All</option>${compOptions}</select></th>
            <th><input type="text" id="fTitle" placeholder="Contains…" title="Filter title"></th>
            <th><input type="text" id="fCr" placeholder="Contains…" title="Filter CR"></th>
            <th></th>
            <th><select id="fStatus" title="Filter status"><option value="">All</option><option>Done</option><option>WIP</option><option>Open</option></select></th>
          </tr>
        </thead>
        <tbody id="rwiBody"></tbody>
      </table>
      </div>
      <div class="rwi-pager" id="rwiPager"></div>
    `;
  }

  function rwiRowHTML(r) {
    return `
      <tr>
        <td>${esc(r.id)}</td>
        <td>${esc(r.component)}</td>
        <td>${esc(r.title)}</td>
        <td>${r.cr ? esc(r.cr) : "—"}</td>
        <td>${r.updated ? esc(r.updated) : "—"}</td>
        <td><span class="st st-${esc(String(r.status || "").toLowerCase())}">${esc(r.status)}</span></td>
      </tr>`;
  }

  function renderTableResults() {
    const body = document.getElementById("rwiBody");
    const pager = document.getElementById("rwiPager");
    const cnt = document.getElementById("rwiCount");
    if (!body) return;

    const gv = id => { const el = document.getElementById(id); return el ? (el.value || "").trim() : ""; };
    const f = {
      id: gv("fId").toLowerCase(),
      component: gv("fComponent"),
      title: gv("fTitle").toLowerCase(),
      cr: gv("fCr").toLowerCase(),
      status: gv("fStatus")
    };

    const rows = activityRowsInWindow().filter(r => {
      if (f.id && !String(r.id || "").toLowerCase().includes(f.id)) return false;
      if (f.component && String(r.component || "").trim().toLowerCase() !== f.component.toLowerCase()) return false;
      if (f.title && !String(r.title || "").toLowerCase().includes(f.title)) return false;
      if (f.cr && !String(r.cr || "").toLowerCase().includes(f.cr)) return false;
      if (f.status && String(r.status || "").trim().toLowerCase() !== f.status.toLowerCase()) return false;
      return true;
    });

    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (tablePage > pages) tablePage = pages;
    if (tablePage < 1) tablePage = 1;
    const start = (tablePage - 1) * PAGE_SIZE;
    const slice = rows.slice(start, start + PAGE_SIZE);

    body.innerHTML = slice.length
      ? slice.map(rwiRowHTML).join("")
      : `<tr><td colspan="6" class="placeholder">${total === 0
            ? "No RWI match your filters in the current window."
            : "No RWI updated in the last " + currentWindow + " days for " + labelOf(currentEnv) + " yet."}</td></tr>`;

    if (cnt) {
      cnt.textContent = total
        ? `${total} matching · showing ${start + 1}–${start + slice.length} of ${total}`
        : "0 matching";
    }
    if (pager) {
      pager.innerHTML = pages > 1
        ? `<button type="button" class="pg" data-pg="prev" ${tablePage <= 1 ? "disabled" : ""}>‹ Prev</button>
           <span class="pg-info">Page ${tablePage} of ${pages}</span>
           <button type="button" class="pg" data-pg="next" ${tablePage >= pages ? "disabled" : ""}>Next ›</button>`
        : "";
    }
  }

  function bindActivityTable() {
    if (!document.getElementById("rwiBody")) return;
    const key = currentProject + "|" + currentApp + "|" + currentEnv;
    if (tableKey !== key) { tableKey = key; tablePage = 1; }

    const controls = document.querySelectorAll("#envDetail .rwi-filters input, #envDetail .rwi-filters select");
    controls.forEach(el => el.addEventListener("change", () => { tablePage = 1; renderTableResults(); }));

    const pager = document.getElementById("rwiPager");
    if (pager) pager.addEventListener("click", ev => {
      const b = ev.target.closest ? ev.target.closest("button.pg") : null;
      if (!b || b.disabled) return;
      tablePage += b.getAttribute("data-pg") === "next" ? 1 : -1;
      renderTableResults();
    });

    const clear = document.getElementById("btnClearFilters");
    if (clear) clear.addEventListener("click", () => {
      controls.forEach(el => { el.value = ""; });
      tablePage = 1;
      renderTableResults();
    });

    renderTableResults();
  }

  // ===== 图表：by App 堆叠柱状图（随 env + 30/60/90 时间窗口变化） =====
  function createAppBarChart() {
    const ctx = document.getElementById("appBarChart");
    if (!ctx) return;
    if (appBarChart) appBarChart.destroy();

    // 副标题写清楚统计范围：本图覆盖整个 market（所有应用），选中的应用高亮
    const sub = document.getElementById("appChartSub");
    if (sub) sub.textContent =
      `All applications · ${currentMarket} · ${labelOf(currentEnv)} · ${currentApp} highlighted`;

    const apps = appKeysOf(currentProject);
    const statMap = {};
    apps.forEach(app => {
      const allTime = getStat(currentProject, app, currentEnv);   // done = 该 env 全部 Done
      const m       = marketRef(currentProject, currentMarket);
      const rows    = (m && m.rwi[app] && m.rwi[app][currentEnv]) || [];
      const doneWin = rows.filter(r => statusKey(r) === "DONE" && isInWindow(r, currentWindow)).length;
      statMap[app] = {
        total:       allTime.total,
        done:        allTime.done,
        doneWin:     doneWin,
        doneEarlier: Math.max(0, allTime.done - doneWin),
        remaining:   Math.max(0, allTime.total - allTime.done)
      };
    });

    // 图例：与右图保持完全相同的结构，保证两图 X 轴在同一条水平线上
    // （此处不放合计数字——按应用拆分的柱状图，市场级合计容易误读）
    const chips = document.getElementById("appChartStats");
    if (chips) {
      chips.innerHTML = `
        <span class="chip"><span class="dot recent"></span>Completed in last ${currentWindow}d</span>
        <span class="chip"><span class="dot earlier"></span>Completed earlier</span>
        <span class="chip"><span class="dot remain"></span>Not complete yet</span>
      `;
    }

    // 选中的应用用实色，其余应用减淡 → Application 的选择对这张图也有可见效果。
    // 注意：「尚未完成」对所有应用保持同一浅灰，否则柱子总高会被误读。
    const onSel = a => a === currentApp;
    const colRecent  = apps.map(a => onSel(a) ? PALETTE.complete    : DIM.complete);
    const colEarlier = apps.map(a => onSel(a) ? PALETTE.completeOld : DIM.completeOld);
    const colRemain  = apps.map(() => PALETTE.remaining);

    appBarChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: apps.map(app => `${app} (${statMap[app].total})`),
        datasets: [
          {
            label: `Completed in last ${currentWindow}d`,
            data: apps.map(app => statMap[app].doneWin),
            backgroundColor: colRecent,
            stack: "workload",
            maxBarThickness: 90
          },
          {
            label: "Completed earlier",
            data: apps.map(app => statMap[app].doneEarlier),
            backgroundColor: colEarlier,
            stack: "workload",
            maxBarThickness: 90
          },
          {
            label: "Not complete yet",
            data: apps.map(app => statMap[app].remaining),
            backgroundColor: colRemain,
            stack: "workload",
            maxBarThickness: 90
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true },
          y: {
            stacked: true,
            beginAtZero: true,
            ticks: { precision: 0 },
            title: { display: true, text: "components" }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterBody(items) {
                if (!items.length) return "";
                const s   = statMap[apps[items[0].dataIndex]];
                const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
                return [`Completion: ${pct}%  (${s.done} of ${s.total})`];
              }
            }
          }
        }
      }
    });
  }

  // ===== 图表：按组件堆叠发布结果（Success / Skipped / Failed，随 30/60/90 窗口） =====
  function normOutcome(v) {
    const k = String(v || "").trim().toLowerCase();
    if (k === "success") return "Success";
    if (k === "skipped") return "Skipped";
    if (k === "failed")  return "Failed";
    return null;
  }

  // 当前 app + env 的发布数据（data.js 里 releases[app][env] = { components, events }）
  function releaseData() {
    const m   = marketRef(currentProject, currentMarket);
    const rel = m && m.releases && m.releases[currentApp] && m.releases[currentApp][currentEnv];
    return rel || { components: [], events: [] };
  }

  // 按时间窗口聚合每个组件的发布结果：{ component: {Success, Skipped, Failed} }
  function releaseCounts(days) {
    const rel = releaseData();
    const byComp = {};
    rel.components.forEach(c => { byComp[c] = { Success: 0, Skipped: 0, Failed: 0 }; });
    rel.events.forEach(e => {
      if (!isInWindow({ updated: e.date }, days)) return;
      const row = byComp[e.component];
      const key = row ? normOutcome(e.outcome) : null;
      if (key) row[key]++;
    });
    return byComp;
  }

  function releaseSummary(days) {
    const rel    = releaseData();
    const byComp = releaseCounts(days);
    const totals = { Success: 0, Skipped: 0, Failed: 0 };
    let released = 0;
    rel.components.forEach(c => {
      const row = byComp[c];
      totals.Success += row.Success;
      totals.Skipped += row.Skipped;
      totals.Failed  += row.Failed;
      if (row.Success > 0) released++;
    });
    const all = totals.Success + totals.Skipped + totals.Failed;
    return {
      totals: totals,
      all: all,
      rate: all ? Math.round((totals.Success / all) * 100) : 0,
      released: released,
      compCount: rel.components.length
    };
  }

  function createComponentReleaseChart() {
    const wrap    = document.getElementById("componentReleaseCanvasWrap");
    const ctx     = document.getElementById("componentReleaseChart");
    const emptyEl = document.getElementById("componentReleaseEmpty");
    if (!ctx) return;
    if (componentReleaseChart) { componentReleaseChart.destroy(); componentReleaseChart = null; }

    const comps = releaseData().components;

    const sub = document.getElementById("componentReleaseSub");
    if (sub) sub.textContent = `${currentApp} only · ${currentMarket} · ${labelOf(currentEnv)}`;
    const statsEl = document.getElementById("componentReleaseStats");
    const sum     = releaseSummary(currentWindow);

    if (!comps.length) {
      if (wrap)    wrap.style.display = "none";
      if (emptyEl) emptyEl.style.display = "";
      if (statsEl) statsEl.innerHTML = "";
      return;
    }
    if (wrap)    wrap.style.display = "";
    if (emptyEl) emptyEl.style.display = "none";

    // 图例即计数：一眼看到 成功 / 跳过 / 失败 的条数
    if (statsEl) statsEl.innerHTML = `
      <span class="chip"><span class="dot success"></span>Success <b>${sum.totals.Success}</b></span>
      <span class="chip"><span class="dot skipped"></span>Skipped <b>${sum.totals.Skipped}</b></span>
      <span class="chip"><span class="dot failed"></span>Failed <b>${sum.totals.Failed}</b></span>
    `;

    const byComp  = releaseCounts(currentWindow);
    componentReleaseChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: comps,
        datasets: [
          { label: "Success", data: comps.map(c => byComp[c].Success), backgroundColor: PALETTE.success, stack: "rel", maxBarThickness: 56 },
          { label: "Skipped", data: comps.map(c => byComp[c].Skipped), backgroundColor: PALETTE.skipped, stack: "rel", maxBarThickness: 56 },
          { label: "Failed",  data: comps.map(c => byComp[c].Failed),  backgroundColor: PALETTE.failed,  stack: "rel", maxBarThickness: 56 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            stacked: true,
            ticks: { autoSkip: false, maxRotation: 45, minRotation: 0, font: { size: 11 } }
          },
          y: {
            stacked: true,
            beginAtZero: true,
            ticks: { precision: 0 },
            title: { display: true, text: "releases" }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterBody(items) {
                if (!items.length) return "";
                const s   = byComp[comps[items[0].dataIndex]];
                const all = s.Success + s.Skipped + s.Failed;
                return [
                  `Success rate: ${all ? Math.round((s.Success / all) * 100) : 0}%`,
                  `Total releases in ${currentWindow}d: ${all}`
                ];
              }
            }
          }
        }
      }
    });
  }

  // ===== 统计：total 为固定值，done 由该 app/env 的 RWI(status="Done") 自动统计 =====
  function getStat(projectKey, appKey, envKey) {
    const m    = marketRef(projectKey, currentMarket);
    const s    = (m && m.apps[appKey] && m.apps[appKey][envKey]) || {};
    const rows = (m && m.rwi[appKey] && m.rwi[appKey][envKey]) || [];
    const done = rows.filter(r => r && String(r.status).toUpperCase() === "DONE").length;
    return { done: done, total: s.total || 0 };
  }

  // ===== 工具函数 =====
  function pctOf(s) {
    if (!s || !s.total) return 0;
    return Math.max(0, Math.min(100, Math.round((s.done / s.total) * 100)));
  }

  function labelOf(envKey) {
    const e = ENV_ORDER.find(x => x.key === envKey);
    return e ? e.label : "";
  }
</script>
</body>
